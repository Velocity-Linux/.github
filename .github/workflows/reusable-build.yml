name: Reusable Build
description: Generic build workflow for C/C++, Go, and other compiled languages
inputs:
  build-command:
    description: "Build command to execute"
    required: true
    type: string
  cache-paths:
    description: "Paths to cache between runs"
    required: false
    type: string
    default: "~/.cargo ~/.go /root/.cache"
  artifact-name:
    description: "Name for the build artifact"
    required: false
    type: string
    default: "build-output"
  upload-artifact:
    description: "Whether to upload artifacts"
    required: false
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      if: contains(inputs.cache-paths, 'go.mod')

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      if: hashFiles('Cargo.toml') != ''

    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-paths }}
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', '**/go.sum', '**/*.c', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Run build
      shell: bash
      run: ${{ inputs.build-command }}

    - name: Upload build artifact
      if: inputs.upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          target/
          build/
          dist/
          bin/
          *.so
          *.a
        retention-days: 7
        compression-level: 6
        overwrite: true
