name: Feature Request
description: Suggest a new feature or improvement for Velocity OS
title: "[FEATURE] "
labels: ["feature", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe the problem and proposed solution clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is it needed?
      placeholder: "Current scheduler does not prioritize foreground gaming processes under mixed workloads."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution in detail
      placeholder: "Add a cgroup-based priority hint that the scheduler reads when elevating gaming threads."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?
    validations:
      required: false

  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks
      description: What are the potential downsides or trade-offs?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information, benchmarks, or references
    validations:
      required: false
